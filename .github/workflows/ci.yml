name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Test executable workspace
        run: cargo test --workspace --locked
      - name: Panic lints on the shipping adapters
        run: rustup component add clippy && cargo clippy -p gateway-runtime --locked
      - name: Concurrent logging failure workloads
        run: cargo test -p gateway-runtime --locked failed_log -- --ignored --nocapture --test-threads=1
      - name: Isolated gateway memory workload
        run: cargo test -p gateway-runtime --locked --lib isolated_gateway_memory_in_both_logging_modes -- --ignored --nocapture

  memory-soak:
    name: Isolated gateway memory soak
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check 100 waves in each logging mode
        run: cargo test -p gateway-runtime --locked --lib isolated_gateway_memory_soak -- --ignored --nocapture

  overload-soak:
    name: Sustained admission overload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: One minute of overload per logging mode
        env:
          SOUNDGATE_OVERLOAD_SECONDS: 60
        run: cargo test -p gateway-runtime --locked --lib sustained_overload -- --ignored --nocapture

  verify:
    name: Verus proofs and mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERUS_RELEASE: 0.2026.10.18.7d82994
      VERUS_ARCHIVE_SHA256: e9af03732d4bdd32b93a8fcf471706739c24c1473fa5086618d96c47237845dd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install checksum-pinned Verus release
        shell: bash
        run: |
          archive="$RUNNER_TEMP/verus.zip"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_RELEASE}/verus-${VERUS_RELEASE}-x86-linux.zip"
          echo "${VERUS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/verus"
          echo "$RUNNER_TEMP/verus/verus-x86-linux" >> "$GITHUB_PATH"
          echo "VERUS=$RUNNER_TEMP/verus/verus-x86-linux/verus" >> "$GITHUB_ENV"
      - name: Report verifier version
        run: verus --version
      - name: Verify production core
        run: cargo verus verify -p gateway-core --locked -- --triggers-mode silent
      - name: Reject deliberate defects
        run: python3 scripts/check_mutations.py

  proxy:
    name: Proxy failover policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution proxy and TLS tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes haproxy openssl
          haproxy -v
      - name: Check no replay and standby routing
        run: python3 scripts/check_proxy.py --haproxy /usr/sbin/haproxy
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check gateway-process failover
        env:
          SOUNDGATE_HAPROXY: /usr/sbin/haproxy
        run: cargo test -p gateway-runtime --locked proxy_gateway_process_failover -- --ignored --nocapture

  storage:
    name: Linux ext4 storage contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install filesystem fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes e2fsprogs util-linux
      - name: Validate full, read-only, and process-crash behavior on private ext4
        run: bash scripts/check_storage.sh

  deploy:
    name: Clean-environment deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution proxy and TLS tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes haproxy openssl curl
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Deploy the documented configuration on the runner
        run: bash scripts/check_deployment.sh
      - name: Build, test, and verify in a clean container
        run: docker build --file deploy/Dockerfile --tag soundgate-deploy .
      - name: Deploy the documented configuration inside the container
        run: docker run --rm soundgate-deploy

  benchmarks:
    name: Release workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Report runner resources
        run: nproc && free -m && df -h "$RUNNER_TEMP"
      - name: Run every opt-in TLS/disk workload in release mode
        run: cargo test -p gateway-runtime --release --locked --lib server::tests::benchmark -- --ignored --nocapture --test-threads=1
