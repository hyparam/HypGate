[package]
name = "gateway-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Blocking network and disk runtime for the LogGate AI gateway"
publish = false

[[bin]]
name = "loggate"
path = "src/main.rs"

[dependencies]
gateway-core = { path = "../gateway-core" }
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
webpki-roots = "1"

[dev-dependencies]
sha2 = "0.10"
rcgen = "0.14"
serde_json = "1"

[lints]
workspace = true
