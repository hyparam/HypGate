[package]
name = "gateway-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gateway-core = { path = "../gateway-core" }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
