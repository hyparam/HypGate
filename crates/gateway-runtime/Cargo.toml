[package]
name = "gateway-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "soundgate"
path = "src/main.rs"

[dependencies]
gateway-core = { path = "../gateway-core" }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time", "net", "signal"] }
bytes = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"
