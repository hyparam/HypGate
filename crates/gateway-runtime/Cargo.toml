[package]
name = "gateway-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "loggate"
path = "src/main.rs"

[dependencies]
gateway-core = { path = "../gateway-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"
