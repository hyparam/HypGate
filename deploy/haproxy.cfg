# Syntax-checked example. Run two hypgate instances on loopback ports 8081/8082.
# Set HYPGATE_TLS_PEM to an operator-managed certificate + private-key PEM.
# Use a currently supported, patched HAProxy release; see docs/deployment.md.
global
    maxconn 256
    tune.bufsize 32768
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    timeout connect 2s
    timeout client 320s
    timeout server 320s
    timeout http-request 10s
    timeout queue 1s
    retries 0
    no option redispatch
    option http-server-close
    http-reuse never

frontend llm
    bind :8443 ssl crt "${HYPGATE_TLS_PEM}"
    acl route_path path_reg ^/routes/[0-9]+$
    acl post_method method POST
    http-request deny deny_status 404 unless route_path post_method
    default_backend gateways

backend gateways
    # Health checks are separate requests; failed generations are never retried.
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server gateway_a 127.0.0.1:8081 check inter 1s fall 2 rise 2 maxconn 128
    server gateway_b 127.0.0.1:8082 backup check inter 1s fall 2 rise 2 maxconn 128
